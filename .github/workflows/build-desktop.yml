name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows-installers
            arch: x86_64
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - platform: macos-14
            artifact-name: macos-arm-installers
            arch: aarch64
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.tar.gz
              src-tauri/target/release/bundle/macos/*.tar.gz.sig

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cache Python runtime
        id: python-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/python-runtime
          key: python-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/requirements.txt', 'scripts/setup-python.sh', 'scripts/setup-python.ps1') }}

      - name: Setup bundled Python runtime (macOS/Linux)
        if: steps.python-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash scripts/setup-python.sh

      - name: Setup bundled Python runtime (Windows)
        if: steps.python-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-python.ps1

      - name: Cache Playwright runtime
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/playwright-runtime
          key: playwright-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-playwright.sh', 'scripts/setup-playwright.ps1', 'src-tauri/playwright-runtime/package.json') }}

      - name: Setup Playwright runtime (macOS/Linux)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash scripts/setup-playwright.sh

      - name: Setup Playwright runtime (Windows)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-playwright.ps1

      - name: Cache dws CLI
        id: dws-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/dws
            src-tauri/resources/dws.exe
          key: dws-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-dws.sh', 'scripts/setup-dws.ps1') }}

      - name: Setup dws CLI (macOS/Linux)
        if: steps.dws-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        env:
          DWS_NONINTERACTIVE: "1"
        run: bash scripts/setup-dws.sh

      - name: Setup dws CLI (Windows)
        if: steps.dws-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dws.ps1

      - name: Download changelog.json from production
        shell: bash
        run: |
          curl -fsSL "https://lotus.renlijia.com/changelog.json" -o src-tauri/changelog.json \
            || echo '{"versions":[]}' > src-tauri/changelog.json

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30

      - name: Upload Windows installer to Aliyun OSS
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          Write-Host "=== Uploading Windows v$version to OSS ==="
          python --version
          if ($LASTEXITCODE) { throw "python not available" }
          python -m pip install --disable-pip-version-check oss2
          if ($LASTEXITCODE) { throw "pip install oss2 failed" }
          python scripts/ci-upload-windows.py $version
          if ($LASTEXITCODE) { throw "ci-upload-windows.py failed (exit $LASTEXITCODE)" }

      - name: Upload macOS bundles to Aliyun OSS
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          echo "=== Uploading macOS ${{ matrix.arch }} v${version} to OSS ==="
          python3 --version
          python3 -m pip install --disable-pip-version-check --user --break-system-packages oss2
          python3 scripts/ci-upload-macos.py "$version" "${{ matrix.arch }}"

  finalize:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and upload update.json
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          python3 -m pip install --disable-pip-version-check --user --break-system-packages oss2
          python3 scripts/ci-finalize.py "$version"
