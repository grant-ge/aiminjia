name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        type: choice
        options:
          - beta
          - release
        default: beta
  push:
    tags:
      - 'v*'
      - 'beta-v*'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows-installers
            arch: x86_64
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - platform: macos-14
            artifact-name: macos-arm-installers
            arch: aarch64
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.tar.gz
              src-tauri/target/release/bundle/macos/*.tar.gz.sig

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release type
        id: release-type
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ inputs.release_type }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/beta-v* ]]; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version#beta-v}"
          else
            version=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cache Playwright runtime
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/playwright-runtime
          key: playwright-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-playwright.sh', 'scripts/setup-playwright.ps1', 'src-tauri/playwright-runtime/package.json') }}

      - name: Setup Playwright runtime (macOS/Linux)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash scripts/setup-playwright.sh

      - name: Setup Playwright runtime (Windows)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-playwright.ps1

      - name: Cache dws CLI
        id: dws-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/dws
            src-tauri/resources/dws.exe
          key: dws-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-dws.sh', 'scripts/setup-dws.ps1') }}

      - name: Setup dws CLI (macOS/Linux)
        if: steps.dws-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        env:
          DWS_NONINTERACTIVE: "1"
        run: bash scripts/setup-dws.sh

      - name: Setup dws CLI (Windows)
        if: steps.dws-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dws.ps1

      - name: Download changelog.json from production
        shell: bash
        run: |
          curl -fsSL "https://ai.renlijia.com/changelog.json" -o src-tauri/changelog.json \
            || echo '{"versions":[]}' > src-tauri/changelog.json

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30

      # --- macOS: upload to OSS immediately (already Apple-signed in CI) ---
      - name: Upload macOS to OSS (release)
        if: runner.os == 'macOS' && steps.release-type.outputs.type == 'release'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          echo "=== Uploading macOS ${{ matrix.arch }} v${version} to OSS ==="
          python3 -m pip install --disable-pip-version-check --user --break-system-packages oss2
          python3 scripts/ci-upload-macos.py "$version" "${{ matrix.arch }}"

      - name: Upload macOS to OSS (beta)
        if: runner.os == 'macOS' && steps.release-type.outputs.type == 'beta'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          echo "=== Uploading macOS beta ${{ matrix.arch }} v${version} to OSS ==="
          python3 -m pip install --disable-pip-version-check --user --break-system-packages oss2
          python3 scripts/ci-upload-macos-beta.py "$version" "${{ matrix.arch }}"

      # --- Windows: upload unsigned exe to OSS staging for local signing ---
      - name: Upload Windows unsigned to OSS staging
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseType = "${{ steps.release-type.outputs.type }}"
          Write-Host "=== Uploading Windows v$version (unsigned, $releaseType) to OSS staging ==="
          python --version
          if ($LASTEXITCODE) { throw "python not available" }
          python -m pip install --disable-pip-version-check oss2
          if ($LASTEXITCODE) { throw "pip install oss2 failed" }
          python scripts/ci-upload-windows-unsigned.py $version $releaseType
          if ($LASTEXITCODE) { throw "ci-upload-windows-unsigned.py failed (exit $LASTEXITCODE)" }

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          RELEASE_TYPE: ${{ needs.build.outputs.release-type || 'unknown' }}
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Windows unsigned exe has been uploaded to OSS staging." >> $GITHUB_STEP_SUMMARY
          echo "macOS signed bundle has been uploaded to OSS." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download Windows exe from OSS staging" >> $GITHUB_STEP_SUMMARY
          echo "2. Sign on local Windows machine" >> $GITHUB_STEP_SUMMARY
          echo "3. Run \`scripts/sign-windows.ps1\` to sign + re-generate .sig + upload" >> $GITHUB_STEP_SUMMARY

  # Finalize only for release builds — generates update.json after Windows signing
  finalize:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/beta-v')
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "## ⚠️ DO NOT run finalize automatically" >> $GITHUB_STEP_SUMMARY
          echo "Windows signing must complete first." >> $GITHUB_STEP_SUMMARY
          echo "Use the 'Finalize Release' workflow after signing." >> $GITHUB_STEP_SUMMARY
