name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        type: choice
        options:
          - beta
          - release
        default: beta
  push:
    tags:
      - 'v*'
      - 'beta-v*'

permissions:
  contents: write

# ============================================================
# Windows builds run on GitHub-hosted runners.
# macOS arm64 + x86_64 are built LOCALLY on the maintainer's Mac
# via scripts/build-and-sign-macos.sh (also handles signing,
# notarization, and OSS upload in one command).
#
# Windows signing/upload is done locally:
#   scripts/sign-and-upload-windows.ps1
# ============================================================

jobs:
  # ────────────────────────────────────────────────────────────
  # Windows (GitHub-hosted runner)
  # ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version#beta-v}"
          else
            version=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.7.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cache dws CLI
        id: dws-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/dws
            src-tauri/resources/dws.exe
          key: dws-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-dws.sh', 'scripts/setup-dws.ps1') }}

      - name: Setup dws CLI (Windows)
        if: steps.dws-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dws.ps1

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload unsigned artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Summary
  # ────────────────────────────────────────────────────────────
  notify:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Generate and upload download page
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          pip install --disable-pip-version-check oss2
          python scripts/ci-generate-download-page.py

      - name: Summary
        run: |
          echo "## Build Complete (Windows only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "macOS builds are produced locally on the maintainer's Mac." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloads" >> $GITHUB_STEP_SUMMARY
          echo "- **Download page**: https://lotus.renlijia.com/aijia/downloads.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps (local signing)" >> $GITHUB_STEP_SUMMARY
          echo "1. **macOS (build + sign + upload, both arches)**:" >> $GITHUB_STEP_SUMMARY
          echo "   \`bash scripts/build-and-sign-macos.sh <version> <beta|release>\`" >> $GITHUB_STEP_SUMMARY
          echo "2. **Windows**: download \`windows-unsigned\` artifact, sign with SimpleSign, then" >> $GITHUB_STEP_SUMMARY
          echo "   \`scripts/sign-and-upload-windows.ps1 <version> <release|beta>\`" >> $GITHUB_STEP_SUMMARY
