name: Finalize Release

# Run MANUALLY after Windows code signing is complete.
# This generates update.json for the Tauri auto-updater.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to finalize (e.g. 0.5.22)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and upload update.json
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          version="${{ inputs.version }}"
          echo "=== Finalizing release v${version} ==="
          python3 -m pip install --disable-pip-version-check --user --break-system-packages oss2
          python3 scripts/ci-finalize.py "$version"

      - name: Refresh downloads.html
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          # After finalize the new release version becomes the canonical
          # downloadable; the public page must reflect that immediately.
          # ci-generate-download-page.py rescans OSS so it is idempotent and
          # safe to re-run from any step.
          python3 scripts/ci-generate-download-page.py
