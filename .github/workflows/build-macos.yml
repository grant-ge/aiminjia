name: Build macOS Apps

# ============================================================
# Cross-platform completion: builds macOS arm64 + x86_64 on
# GitHub-hosted runners (native per-arch, no cross-compile).
#
#   macos-14  -> Apple Silicon (darwin-arm64)
#   macos-13  -> Intel         (darwin-x64)
#
# Windows builds live in build-desktop.yml (already on GitHub CI).
#
# NOTE: GitHub produces UNSIGNED .app/.dmg. Apple codesign +
# notarization still happen LOCALLY (Developer ID cert lives in
# the maintainer's Keychain) via:
#   scripts/build-and-sign-macos.sh <version> <beta|release>
# This workflow is for build verification + downloadable unsigned
# artifacts, not for shipping signed releases.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Which architecture(s) to build'
        type: choice
        options:
          - both
          - arm64
          - x86_64
        default: both

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (${{ matrix.plat }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            plat: darwin-arm64
            arch: arm64
          - runner: macos-13
            plat: darwin-x64
            arch: x86_64
    steps:
      - name: Skip unselected arch
        id: gate
        run: |
          want="${{ github.event.inputs.arch }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.arch }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Arch ${{ matrix.arch }} not selected ($want); skipping."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Extract version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          version=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        if: steps.gate.outputs.run == 'true'
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Rust stable
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.gate.outputs.run == 'true'
        uses: swatinem/rust-cache@v2.7.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-all-crates: true
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install frontend dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install

      - name: Cache dws CLI
        if: steps.gate.outputs.run == 'true'
        id: dws-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/dws
          key: dws-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-dws.sh') }}

      - name: Setup dws CLI (macOS)
        if: steps.gate.outputs.run == 'true' && steps.dws-cache.outputs.cache-hit != 'true'
        env:
          DWS_NONINTERACTIVE: '1'
        run: bash scripts/setup-dws.sh

      - name: Cache bundled runtime sources
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-sources-v1-${{ runner.arch }}-${{ hashFiles('scripts/runtime-sources.json') }}
          restore-keys: runtime-sources-v1-${{ runner.arch }}-

      - name: Prepare bundled runtime (Node/Python/uv)
        if: steps.gate.outputs.run == 'true'
        run: PLATFORM=${{ matrix.plat }} bash scripts/prepare-bundled-runtime.sh

      - name: Verify bundled runtime layout
        if: steps.gate.outputs.run == 'true'
        run: |
          base="src-tauri/resources/runtime/${{ matrix.plat }}"
          test -x "$base/node/bin/node"      || { echo "node missing"; exit 1; }
          test -x "$base/python/bin/python3"  || { echo "python3 missing"; exit 1; }
          test -x "$base/uv/bin/uv"           || { echo "uv missing"; exit 1; }
          test -d "$base/node/node_modules"   || { echo "node_modules dir missing"; exit 1; }
          test -d "$base/python/lib/site-packages" || { echo "site-packages dir missing"; exit 1; }
          "$base/node/bin/node" --version
          "$base/python/bin/python3" --version
          "$base/uv/bin/uv" --version

      - name: Build Tauri app
        if: steps.gate.outputs.run == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload unsigned artifacts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  summary:
    name: Summary
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notes
        run: |
          echo "## macOS Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Produced **unsigned** arm64 / x86_64 artifacts (Apple codesign + notarization are done locally)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To ship a signed release, run locally on a Mac:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "bash scripts/build-and-sign-macos.sh <version> <beta|release>" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
