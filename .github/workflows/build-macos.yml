name: Build macOS Apps

# ============================================================
# Cross-platform completion: builds macOS arm64 + x86_64 on
# GitHub-hosted runners using the official tauri-apps/tauri-action.
#
#   macos-14  -> Apple Silicon (darwin-arm64)
#   macos-13  -> Intel         (darwin-x64)
#
# tauri-action only wraps `tauri build`; the project's custom
# bundled-runtime + dws steps run BEFORE it, artifact upload runs
# AFTER it. No tagName is passed, so it builds WITHOUT creating a
# GitHub Release.
#
# Apple codesign + notarization stay LOCAL (Developer ID cert lives
# in the maintainer's Keychain) via:
#   scripts/build-and-sign-macos.sh <version> <beta|release>
# This workflow produces UNSIGNED build-verification artifacts.
#
# Windows builds live in build-desktop.yml.
# ============================================================

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'beta-v*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (${{ matrix.plat }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            plat: darwin-arm64
          - runner: macos-13
            plat: darwin-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.7.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-all-crates: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cache dws CLI
        id: dws-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/dws
          key: dws-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-dws.sh') }}

      - name: Setup dws CLI (macOS)
        if: steps.dws-cache.outputs.cache-hit != 'true'
        env:
          DWS_NONINTERACTIVE: '1'
        run: bash scripts/setup-dws.sh

      - name: Cache bundled runtime sources
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-sources-v1-${{ runner.arch }}-${{ hashFiles('scripts/runtime-sources.json') }}
          restore-keys: runtime-sources-v1-${{ runner.arch }}-

      - name: Prepare bundled runtime (Node/Python/uv)
        run: PLATFORM=${{ matrix.plat }} bash scripts/prepare-bundled-runtime.sh

      - name: Verify bundled runtime layout
        run: |
          base="src-tauri/resources/runtime/${{ matrix.plat }}"
          test -x "$base/node/bin/node"      || { echo "node missing"; exit 1; }
          test -x "$base/python/bin/python3"  || { echo "python3 missing"; exit 1; }
          test -x "$base/uv/bin/uv"           || { echo "uv missing"; exit 1; }
          test -d "$base/node/node_modules"   || { echo "node_modules dir missing"; exit 1; }
          test -d "$base/python/lib/site-packages" || { echo "site-packages dir missing"; exit 1; }
          "$base/node/bin/node" --version
          "$base/python/bin/python3" --version
          "$base/uv/bin/uv" --version

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # No tagName/releaseName: build only, do NOT create a GitHub Release.
        # Apple signing + OSS upload happen locally afterwards.

      - name: Upload unsigned artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.plat }}-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30
