name: Release

# Official Tauri cross-platform build, per
# https://www.tauri.net.cn/53.html (跨平台编译).
#
# Three parallel runners (no universal — split for speed):
#   macos-14         -> Apple Silicon (darwin-arm64)
#   macos-13         -> Intel         (darwin-x64)
#   windows-latest   -> Windows x64
#
# Each runner builds its NATIVE arch (no --target / cross-compile), so
# each only needs the single matching bundled runtime. macOS min system
# version pinned to 10.15.

on:
  workflow_dispatch:
  push:
    branches:
      - chore/github-cross-platform-ci
    tags:
      - 'v*'

permissions:
  contents: write

# Cancel an in-progress run when a newer commit is pushed to the same ref,
# so stale builds don't pile up and waste runner minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            label: macos-arm64
            os: macos
            runtime_plat: darwin-arm64
          - platform: macos-13
            label: macos-x64
            os: macos
            runtime_plat: darwin-x64
          - platform: windows-latest
            label: windows-x64
            os: windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync node version and setup cache
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}
          cache-on-failure: true
          # swatinem/rust-cache only SAVES cache on the default branch by
          # default; this feature branch would never accumulate a cache and
          # always full-rebuild. Allow saving here so incremental builds work.
          save-if: 'true'

      - name: Install frontend dependencies
        run: pnpm install

      # tauri.conf.json declares `resources/runtime` (+ `resources/dws*`) as
      # bundle resources, so src-tauri/build.rs FAILS AT COMPILE TIME if these
      # don't exist on disk. These prep steps must run BEFORE tauri-action.
      - name: Cache bundled runtime sources
        uses: actions/cache@v5
        with:
          path: .runtime-cache
          key: runtime-sources-v1-${{ matrix.label }}-${{ hashFiles('scripts/runtime-sources.json') }}
          restore-keys: runtime-sources-v1-${{ matrix.label }}-

      - name: Prepare bundled runtime (macOS)
        if: matrix.os == 'macos'
        run: PLATFORM=${{ matrix.runtime_plat }} bash scripts/prepare-bundled-runtime.sh

      - name: Prepare bundled runtime (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: .\scripts\prepare-bundled-runtime.ps1

      - name: Setup dws CLI (macOS)
        if: matrix.os == 'macos'
        env:
          DWS_NONINTERACTIVE: '1'
        run: bash scripts/setup-dws.sh

      - name: Setup dws CLI (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dws.ps1

      - name: Disable updater signing (no signing key in CI yet)
        # tauri.conf.json ships an updater pubkey, which makes `tauri build`
        # REQUIRE TAURI_SIGNING_PRIVATE_KEY. Until that secret is configured,
        # strip the pubkey and skip updater artifacts so the build verifies
        # cross-platform packaging without signing. node is available on all
        # runners, so this stays cross-platform.
        run: node scripts/ci-disable-updater-signing.mjs

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && 'AIjia v__VERSION__' || '' }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false

      # Upload installers as run artifacts so branch-push builds are
      # downloadable from the Actions UI (30-day retention). Tag pushes also
      # get a draft GitHub Release via tauri-action above.
      - name: Upload macOS artifacts
        if: matrix.os == 'macos' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}-app
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.os == 'windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
