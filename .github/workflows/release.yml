name: Release

# Official Tauri cross-platform build, per
# https://www.tauri.net.cn/53.html (跨平台编译).
#
# Two runners:
#   macos-14 (Apple Silicon) -> universal-apple-darwin (Intel + Apple Silicon
#       in ONE package). Built on arm64 only so it never waits on the scarce
#       macos-13 Intel runner pool.
#   windows-latest           -> Windows x64
#
# macOS min system version pinned to 10.15.

on:
  workflow_dispatch:
  push:
    branches:
      - chore/github-cross-platform-ci
    tags:
      - 'v*'

permissions:
  contents: write

# Cancel an in-progress run when a newer commit is pushed to the same ref,
# so stale builds don't pile up and waste runner minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    env:
      # Mirror the secret to a job env so step `if:` can branch on whether
      # signing is configured (the `secrets` context isn't reliable in `if:`).
      HAS_TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            label: macos-universal
            os: macos
            args: '--target universal-apple-darwin'
            bundle_dir: 'src-tauri/target/universal-apple-darwin/release/bundle'
          - platform: windows-latest
            label: windows-x64
            os: windows
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync node version and setup cache
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      # Explicitly add the macOS universal targets. The dtolnay `targets:`
      # input proved unreliable here (only aarch64 ended up installed, so the
      # universal build failed with "x86_64-apple-darwin is not installed").
      # An explicit rustup call is deterministic regardless of action/caching.
      - name: Add Rust targets (macOS universal)
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}
          cache-on-failure: true
          # swatinem/rust-cache only SAVES cache on the default branch by
          # default; this feature branch would never accumulate a cache and
          # always full-rebuild. Allow saving here so incremental builds work.
          save-if: 'true'

      - name: Install frontend dependencies
        run: pnpm install

      # tauri.conf.json declares `resources/runtime` (+ `resources/dws*`) as
      # bundle resources, so src-tauri/build.rs FAILS AT COMPILE TIME if these
      # don't exist on disk. These prep steps must run BEFORE tauri-action.
      - name: Cache bundled runtime sources
        uses: actions/cache@v5
        with:
          path: .runtime-cache
          key: runtime-sources-v1-${{ matrix.label }}-${{ hashFiles('scripts/runtime-sources.json') }}
          restore-keys: runtime-sources-v1-${{ matrix.label }}-

      - name: Prepare bundled runtime (macOS — both arches for universal)
        if: matrix.os == 'macos'
        run: |
          PLATFORM=darwin-arm64 bash scripts/prepare-bundled-runtime.sh
          PLATFORM=darwin-x64  bash scripts/prepare-bundled-runtime.sh

      - name: Prepare bundled runtime (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: .\scripts\prepare-bundled-runtime.ps1

      - name: Setup dws CLI (macOS)
        if: matrix.os == 'macos'
        env:
          DWS_NONINTERACTIVE: '1'
        run: bash scripts/setup-dws.sh

      - name: Setup dws CLI (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dws.ps1

      - name: Disable updater signing (only when no signing key configured)
        # tauri.conf.json ships an updater pubkey, which makes `tauri build`
        # REQUIRE TAURI_SIGNING_PRIVATE_KEY. When that secret is NOT set, strip
        # the pubkey so unsigned build verification still works. Once the
        # secret is configured this step is skipped and real signing happens.
        if: env.HAS_TAURI_KEY != 'true'
        run: node scripts/ci-disable-updater-signing.mjs

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          # Tauri updater (Ed25519) signing key. Empty when not configured.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple codesign + notarization (macOS only). tauri-action skips
          # signing automatically when APPLE_CERTIFICATE is empty.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && 'AIjia v__VERSION__' || '' }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Upload installers as run artifacts so branch-push builds are
      # downloadable from the Actions UI (30-day retention). Tag pushes also
      # get a draft GitHub Release via tauri-action above.
      - name: Upload macOS artifacts
        if: matrix.os == 'macos' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.bundle_dir }}/macos/*.app
            ${{ matrix.bundle_dir }}/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.os == 'windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.bundle_dir }}/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
