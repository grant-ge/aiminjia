name: Release

# Official Tauri cross-platform build, per
# https://www.tauri.net.cn/53.html (跨平台编译).
#
# Builds the app for macOS (universal: Intel + Apple Silicon) and
# Windows in one matrix run via tauri-apps/tauri-action, and creates
# a draft GitHub Release with the installers attached.

on:
  workflow_dispatch:
  push:
    branches:
      - chore/github-cross-platform-ci
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      # tauri.conf.json declares `resources/runtime` (+ `resources/dws*`) as
      # bundle resources, so src-tauri/build.rs FAILS AT COMPILE TIME if these
      # don't exist on disk. These prep steps must run BEFORE tauri-action.
      - name: Cache bundled runtime sources
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-sources-v1-${{ runner.os }}-${{ hashFiles('scripts/runtime-sources.json') }}
          restore-keys: runtime-sources-v1-${{ runner.os }}-

      - name: Prepare bundled runtime (macOS — both arches for universal)
        if: matrix.platform == 'macos-latest'
        run: |
          PLATFORM=darwin-arm64 bash scripts/prepare-bundled-runtime.sh
          PLATFORM=darwin-x64  bash scripts/prepare-bundled-runtime.sh

      - name: Prepare bundled runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\scripts\prepare-bundled-runtime.ps1

      - name: Setup dws CLI (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          DWS_NONINTERACTIVE: '1'
        run: bash scripts/setup-dws.sh

      - name: Setup dws CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dws.ps1

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && 'AIjia v__VERSION__' || '' }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
