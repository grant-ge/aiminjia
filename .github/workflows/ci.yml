name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      # `tauri_build::build()` (run from src-tauri/build.rs at compile time)
      # asserts that all `bundle.resources` paths in tauri.conf.json exist on
      # disk — this includes `resources/runtime` (Node/Python/uv bundled
      # runtime). Without this step, `cargo check` fails with
      # `resource path 'resources/runtime' doesn't exist`. Mirror what
      # build-desktop.yml does so PR check matches release build.
      - name: Cache bundled runtime sources
        uses: actions/cache@v5
        with:
          path: .runtime-cache
          key: runtime-sources-v1-${{ hashFiles('scripts/runtime-sources.json') }}
          restore-keys: runtime-sources-v1-

      - name: Prepare bundled runtime (Node/Python/uv)
        run: bash scripts/prepare-bundled-runtime.sh

      - name: Rust compile check
        working-directory: src-tauri
        run: cargo check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint
