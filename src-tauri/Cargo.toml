[package]
name = "aijia"
version = "0.5.33"
description = "AIjia — 组织专家，工作助手"
authors = ["AIjia Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.10.0", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

# E2E UI automation plugin (optional, gated by `e2e` feature).
# Public fork; no auth needed to fetch.
tauri-plugin-pilot = { git = "https://github.com/panzhenchao/tauri-pilot.git", branch = "main", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
serde_yaml = "0.9"
gray_matter = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream", "socks", "multipart"] }

# URL parsing (SSRF 检查等)
url = "2"

# Encryption
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
ecb = { version = "0.1", features = ["std"] }

# Logging
log = "0.4"

# Home directory resolution
dirs = "6"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Async utilities
futures = "0.3"
once_cell = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-socks = "0.5"
tokio-websockets = { version = "0.13", features = ["client", "rustls-bring-your-own-connector", "getrandom", "sha1_smol"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
async-channel = "2"
http = "1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
shell-words = "1.1"
globset = "0.4"

urlencoding = "2"

# System proxy detection (macOS scutil / Windows registry).
# Telegram + WhatsApp 用,直接读系统级网络代理(系统偏好设置 → 网络 → 代理,
# 或 ClashX / Surge / Clash for Windows 等翻墙工具开"系统代理"时写入的位置)。
sysproxy = "0.3"

# Plugin system
async-trait = "0.1"
tokio-stream = "0.1"
zip = "2"
tar = "0.4"
flate2 = "1"

lru = "0.12"
regex = "1"
fastrand = "2"
rand = "0.8"

# WhatsApp Web (multi-device) connector — OpenClaw-equivalent route
# (Baileys/whatsmeow protocol). See docs/superpowers/specs/2026-05-18-im-whatsapp-phase4-design.md.
#
# Using `wa-rs` (homunbot/wa-rs), a fork of jlucaso1/whatsapp-rust that
# removes `#![feature(portable_simd)]` and `if_let_chains` so the crate
# compiles on stable Rust (upstream whatsapp-rust requires nightly).
# wa-rs re-exports sqlite-storage / tokio-transport / ureq-http as default
# features; cross-platform (sqlite via rusqlite bundled).
wa-rs = "0.2"
# wa-rs's sqlite-storage feature pulls in `libsqlite3-sys` (via diesel),
# which by default expects the system sqlite3 lib at link time. Windows
# CI runners don't ship sqlite3.lib, so the link step fails with
# `LNK1181: cannot open input file 'sqlite3.lib'`. Pin the same
# libsqlite3-sys version transitive deps select and turn on `bundled`
# so the C source is compiled in — works on all 3 platforms without
# needing a system install.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

# Unix process inspection (kill(pid, 0) for orphan lock detection)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
which = "6"
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
mockito = "1"

[features]
default = []
# Enable E2E UI automation. Activates the optional `tauri-plugin-pilot` dep,
# which is registered in `src/lib.rs` under `#[cfg(feature = "e2e")]`.
# Build / run with `--features e2e` to enable.
e2e = ["dep:tauri-plugin-pilot"]
# Expose test-only constructors/helpers (e.g. NetworkProbe::new_for_test).
# Used by integration tests: cargo test --test <name> --features test-support
test-support = []

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind" # TEMP v0.5.6: switched to unwind so panic hook can flush logs before abort
