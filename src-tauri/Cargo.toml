[package]
name = "aijia"
version = "0.5.25-beta.2"
description = "AIjia — 组织专家，工作助手"
authors = ["AIjia Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.10.0", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
serde_yaml = "0.9"
gray_matter = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Encryption
aes-gcm = "0.10"

# Logging
log = "0.4"

# Home directory resolution
dirs = "6"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Async utilities
futures = "0.3"
once_cell = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
shell-words = "1.1"
globset = "0.4"

# Browser automation (Playwright via Node.js sidecar, replaces chromiumoxide)
url = "2"
urlencoding = "2"

# Plugin system
async-trait = "0.1"
toml = "0.8"
zip = "2"
tar = "0.4"
flate2 = "1"

# File watching (skill dev mode hot-reload)
notify = "7"
lru = "0.12"
regex = "1"

# Unix process inspection (kill(pid, 0) for orphan lock detection)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
which = "6"
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
mockito = "1"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind" # TEMP v0.5.6: switched to unwind so panic hook can flush logs before abort
