[plugin]
id = "customer-segmentation"
name = "客户细分分析"
type = "skill"
description = "Customer segmentation analysis: RFM, lifecycle, value clustering"
priority = 20

[trigger]
keywords = [
    "客户细分", "客户分层", "客户分类", "客户画像",
    "RFM分析", "客户价值", "客户生命周期", "客户分群",
    "customer segmentation", "customer clustering", "RFM analysis",
    "customer lifetime value", "customer profiling",
]
requires_files = true

file_keywords = [
    "客户", "用户", "会员", "消费", "订单",
    "customer", "user", "member", "purchase", "order",
]

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "sales"
icon = "👥"
short_description = "RFM 分层、生命周期、价值聚类分析"
short_description_en = "Segment customers by behavior/value for targeted operations"
trigger_text = "帮我做客户细分分析"
name_en = "Customer Segmentation Analysis"
