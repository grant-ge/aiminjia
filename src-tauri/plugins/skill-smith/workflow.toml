# Skill-Smith 工作流（4 步）
#
# Step 0: 理解需求 — 澄清场景、输入输出、领域知识
# Step 1: 生成技能 — 一次性生成 plugin.toml + SKILL.md + 可选 scripts/references
# Step 2: 安装测试 — dry-run 校验 + 安装/导出
# Step 3: 迭代优化 — 根据用户反馈修改并重新安装

[[steps]]
id = "step0"
name = "理解需求"
prompt = "prompts/step0-understand.md"
tools_only = ["skill_smith_create_draft", "save_analysis_note"]
max_iterations = 5
token_budget = 8192
advance_on = "confirm"

[[steps]]
id = "step1"
name = "生成技能"
prompt = "prompts/step1-generate.md"
tools_only = ["skill_smith_read_file", "skill_smith_write_file", "skill_smith_validate", "save_analysis_note"]
max_iterations = 15
token_budget = 8192
advance_on = "confirm"

[[steps]]
id = "step2"
name = "安装测试"
prompt = "prompts/step2-install.md"
tools_only = ["skill_smith_read_file", "skill_smith_dry_run", "skill_smith_install", "skill_smith_export", "save_analysis_note"]
max_iterations = 10
token_budget = 8192
advance_on = "confirm"

[[steps]]
id = "step3"
name = "迭代优化"
prompt = "prompts/step3-iterate.md"
tools_only = ["skill_smith_read_file", "skill_smith_write_file", "skill_smith_validate", "skill_smith_dry_run", "skill_smith_install", "save_analysis_note"]
max_iterations = 15
token_budget = 8192
advance_on = "confirm"
