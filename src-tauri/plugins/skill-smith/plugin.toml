[plugin]
id = "skill-smith"
name = "创建自己的技能"
type = "skill"
description = "Conversational skill creation — build your own AI skill through dialogue"
priority = 10

[trigger]
keywords = [
    "创建技能", "新建技能", "做个技能", "做一个技能",
    "自定义技能", "制作技能", "我想要一个技能",
    "create skill", "build skill", "new skill", "make skill",
]
requires_files = false

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "general"
icon = "🛠️"
short_description = "用对话创建你自己的 AI 技能"
short_description_en = "Build your own AI skill through dialogue"
trigger_text = "我想创建一个技能"
name_en = "Skill Smith"
