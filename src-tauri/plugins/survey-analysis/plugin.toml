[plugin]
id = "survey-analysis"
name = "问卷调研分析"
type = "skill"
description = "Survey analysis: response distribution, cross-tabulation, sentiment analysis"
priority = 20

[trigger]
keywords = [
    "问卷分析", "调研分析", "问卷数据", "调查问卷",
    "满意度调查", "NPS分析", "问卷统计", "调研报告",
    "survey analysis", "questionnaire analysis", "NPS",
    "satisfaction survey", "poll analysis",
]
requires_files = true

file_keywords = [
    "问卷", "调研", "调查", "反馈", "满意度",
    "survey", "questionnaire", "feedback", "poll",
]

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "general"
icon = "📋"
short_description = "问卷统计、交叉分析、情感分析"
trigger_text = "帮我分析问卷数据"
