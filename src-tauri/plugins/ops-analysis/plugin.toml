[plugin]
id = "ops-analysis"
name = "运营数据分析"
type = "skill"
description = "Operations data analysis: GMV, conversion funnel, channel ROI, cohort retention"
priority = 20

[trigger]
keywords = [
    "运营分析", "运营数据", "GMV分析", "转化分析",
    "渠道分析", "留存分析", "活跃分析", "DAU",
    "运营报表", "运营指标", "增长分析",
    "operations analysis", "conversion funnel", "retention analysis",
    "channel ROI", "growth analysis",
]
requires_files = true

file_keywords = [
    "运营", "转化", "留存", "活跃", "渠道", "GMV",
    "ops", "conversion", "retention", "active", "channel",
]

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "ops"
icon = "🛒"
short_description = "转化漏斗、渠道 ROI、留存分析"
trigger_text = "帮我分析运营数据"
