[plugin]
id = "multi-file-handler"
name = "多文件处理"
type = "skill"
description = "Cross-file processing: compare / merge / batch-translate / cross-reference / summarize multiple files"
priority = 15

[trigger]
# 纯结构关键词（不含薪酬/销售等业务词，这样业务专用技能如 comp-analysis-v2 依然优先触发）
keywords = [
    "多文件", "批量", "这两个文件", "这些文件", "一起",
    "对比", "合并", "汇总", "版本对比", "月度对比",
    "batch", "compare", "merge", "aggregate",
]
requires_files = true

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 8
token_budget = 10240

[display]
category = "general"
icon = "🗂️"
short_description = "跨文件对比 / 合并 / 批处理 / 交叉分析 / 汇总"
short_description_en = "Compare / merge / batch-process / cross-reference / summarize multiple files"
trigger_text = "帮我对比这两个文件"
name_en = "Multi-File Handler"
