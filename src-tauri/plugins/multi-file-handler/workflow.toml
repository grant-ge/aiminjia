# multi-file-handler — 跨文件处理工作流（4 步）
#
# step0: 意图分流 —— LLM 产出结构化 JSON intent（mode + 对比维度）存到 note
# step1: 加载 & 理解 —— load 所有文件，生成 schema 对齐表
# step2: 执行（动态 prompt 路由）—— 根据 step0.mode 走 5 个分支之一
# step3: 交付 —— 生成 HTML 报告 + Excel 明细

[[steps]]
id = "step0"
name = "意图分流"
prompt = "prompts/step0-intent.md"
tools_only = ["save_analysis_note", "load_file"]
max_iterations = 5
token_budget = 8192
advance_on = "confirm"

[[steps]]
id = "step1"
name = "加载文件 & schema 对齐"
prompt = "prompts/step1-load.md"
tools_only = ["execute_python", "load_file", "save_analysis_note"]
tools_on_feedback = ["execute_python", "load_file"]
max_iterations = 8
max_iterations_feedback = 15
token_budget = 10240
advance_on = "confirm"

# ─── Step 2：按 step0.mode 动态分支 ──────────────────────────────────
# Phase 12 dynamic routing：从 step0 保存的 intent JSON 读 mode 字段，
# 选对应 branch prompt。找不到就走 default_branch ("compare")。
[[steps]]
id = "step2"
name = "执行（按意图分支）"
prompt_router = "note:step0_intent.mode"
default_branch = "compare"
tools_only = ["execute_python", "export_data", "generate_chart", "save_analysis_note"]
tools_on_feedback = ["execute_python", "export_data", "generate_chart"]
max_iterations = 10
max_iterations_feedback = 15
token_budget = 12288
advance_on = "confirm"

[steps.prompts]
compare         = "prompts/step2-compare.md"
merge           = "prompts/step2-merge.md"
batch_translate = "prompts/step2-batch_translate.md"
cross_ref       = "prompts/step2-cross_ref.md"
summarize_all   = "prompts/step2-summarize.md"

[[steps]]
id = "step3"
name = "生成报告 & 交付"
prompt = "prompts/step3-report.md"
tools_only = ["generate_report", "export_data", "save_analysis_note", "generate_slides"]
max_iterations = 8
token_budget = 8192
advance_on = "confirm"
