[plugin]
id = "budget-analysis"
name = "预算执行分析"
type = "skill"
description = "Budget vs actual analysis: variance analysis, forecast accuracy, budget control"
priority = 20

[trigger]
keywords = [
    "预算分析", "预算执行", "预算对比", "预算差异",
    "预实对比", "预算达成", "预算偏差", "预算管控",
    "budget analysis", "budget vs actual", "variance analysis",
    "budget performance", "forecast accuracy",
]
requires_files = true

file_keywords = [
    "预算", "实际", "差异", "达成率",
    "budget", "actual", "variance", "forecast",
]

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "finance"
icon = "📊"
short_description = "预实差异分析、达成率、偏差归因"
trigger_text = "帮我分析预算执行情况"
