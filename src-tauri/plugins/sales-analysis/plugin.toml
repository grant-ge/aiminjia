[plugin]
id = "sales-analysis"
name = "销售数据分析"
type = "skill"
description = "Sales data analysis workflow: trend, conversion, customer segmentation"
priority = 20

[trigger]
keywords = [
    "销售分析", "销售数据", "销售趋势", "销售漏斗",
    "转化率", "客户分析", "销售业绩", "销售报表",
    "sales analysis", "sales data", "sales trend", "conversion rate",
    "sales funnel", "sales performance",
]
requires_files = true

file_keywords = [
    "销售", "订单", "客户", "成交", "业绩",
    "sales", "order", "customer", "deal", "revenue",
]

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "sales"
icon = "📊"
short_description = "销售趋势、转化漏斗、客户细分分析"
trigger_text = "帮我分析销售数据"
