[[steps]]
id = "step0"
name = "文件加载与制度识别"
prompt = "prompts/step0.md"
tools_only = ["load_file", "save_analysis_note"]
max_iterations = 5
token_budget = 8192
advance_on = "any"

[[steps]]
id = "step1"
name = "条款提取与结构化"
prompt = "prompts/step1.md"
precompute = "scripts/step1.py"
tools_only = ["save_analysis_note"]
max_iterations = 8
token_budget = 8192
advance_on = "confirm"

[[steps]]
id = "step2"
name = "逐条合规审查"
prompt = "prompts/step2.md"
tools_only = ["save_analysis_note", "web_search"]
max_iterations = 8
token_budget = 8192
advance_on = "confirm"

[[steps]]
id = "step3"
name = "审查报告与修改建议"
prompt = "prompts/step3.md"
tools_only = ["generate_report", "export_data"]
tools_on_feedback = ["generate_report", "export_data"]
max_iterations = 8
max_iterations_feedback = 3
token_budget = 8192
advance_on = "confirm"
