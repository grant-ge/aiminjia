[plugin]
id = "policy-compliance-audit"
name = "规章制度合规审查"
type = "skill"
description = "Company policy compliance audit: clause-by-clause review against labor laws"
priority = 20

[trigger]
keywords = [
    "规章制度审查", "规章制度合规", "员工手册审查", "员工手册合规",
    "制度合规", "制度审查", "规章审查", "手册审查",
    "考勤制度审查", "薪酬制度审查", "奖惩制度审查",
    "policy audit", "policy compliance", "handbook review",
    "employee handbook", "company policy review",
]
requires_files = true
file_keywords = [
    "规章", "制度", "手册", "办法", "规定", "条例", "细则",
    "考勤", "奖惩", "薪酬", "员工手册",
    "policy", "handbook", "regulation", "rule",
]

[model]
preference = "deep_reasoning"

[prompts]
include_app_base = true

[defaults]
max_iterations = 5
token_budget = 8192

[display]
category = "legal"
icon = "📜"
short_description = "逐条对照劳动法，识别无效/违规条款"
short_description_en = "Audit company policies for legal compliance and risk gaps"
trigger_text = "帮我审查公司规章制度"
name_en = "Policy Compliance Audit"
