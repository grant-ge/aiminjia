[package]
name = "cdp-compare"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench_chromiumoxide"
path = "src/bench_chromiumoxide.rs"

[[bin]]
name = "bench_chromey"
path = "src/bench_chromey.rs"

[dependencies]
chromiumoxide_old = { package = "chromiumoxide", version = "0.7", features = ["tokio-runtime"], default-features = false }
chromiumoxide_new = { package = "chromey", version = "2" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
